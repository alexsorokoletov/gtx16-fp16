[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtx16-fp16"
version = "0.1.0"
description = "Fast fp16 matmul for GTX 16-series (TU116/TU117) GPUs: uses the fp16 units instead of cuBLAS's emulated tensor-core path"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
